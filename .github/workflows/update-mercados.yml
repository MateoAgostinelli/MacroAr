name: Actualizar datos de mercado

# Refresca el MSCI Merval, oro, soja y petróleo desde Yahoo Finance.
# Los demás indicadores (BCRA, INDEC, Bluelytics, ArgentinaDatos) se consumen en
# vivo desde el browser, así que no necesitan actualización acá.
# ICC y EI (UTDT) se actualizan solos con fetch_utdt.py (update-utdt.yml).
# Los REM (BCRA) se actualizan solos con fetch_rem.py (update-rem.yml).

on:
  schedule:
    # Lunes a viernes a las 21:00 UTC (18:00 ART), después del cierre del mercado.
    # Diario porque el MSCI Merval solo trae el último cierre y se acumula por corrida.
    - cron: '0 21 * * 1-5'
  workflow_dispatch:  # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Traer datos de mercado
        shell: bash
        run: python fetch_mercados.py 2>&1 | tee salida.txt

      # Si una serie falla, el paso anterior sale con error (el run queda en rojo),
      # pero igual se commitean las que sí se actualizaron.
      - name: Commitear si hay cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "data: auto-update mercados y commodities ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Sin cambios en los datos."
          fi

      - name: Avisar por Telegram si falló
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash .github/scripts/avisar-telegram.sh salida.txt
